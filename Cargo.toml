[package]
name = "rsdupes"
version = "0.1.0"
edition = "2024"
license = "MIT"
author = "epsilon-phase"
[rustc]
flags=['-Znext-solver']

[dependencies]
mimalloc = "0.1.48"
serde = {version = "1.0.225", features=['derive']}
serde_json = "1.0.145"
sha2 = "*"
tokio = {version="~1.41", features=["full"]}
generic-array = {version='0.14.7',features=['serde']}
clap = { version = "4.5.47", features = ["derive"] }
fmmap = {version = "^0.4.0", features = ["tokio"]}
glob = {version = "0.3.3"}
console = "0.16.1"

[profile.reldebug]
inherits = "release"
debug=true
